if(!mine)return `<div class="pad"><div class="card" style="text-align:center"><h3>${t("getSlot")}</h3><p>${t("slotSub")}</p><button class="btn" onclick="openFind()">${t("find")}</button></div></div>`;

function vFood(){const v=S.ev;return `<div class="pad"><h1 class="ti">${t("menu")}</h1><p class="tx">${t("foodAt")} <b>${esc(v.foodAt)}</b></p><div class="card">${v.menu.split("\n").filter(Boolean).map(x=>`<div class="row"><div class="av">◆</div><div>${esc(x)}</div></div>`).join("")}</div>${v.live?`<a class="btn" href="${url(v.live)}" target="_blank" rel="noopener">${t("live")}</a>`:""}</div>`}
function vPhotos(){return `<div class="pad"><div class="card"><h3>${t("up")}</h3><p>${t("upSub")}</p><label class="btn" style="display:block">${t("up")}<input type="file" accept="image/*" multiple hidden onchange="upl(this.files)"></label></div>${adm&&ON?'<button class="btn alt" onclick="zipAll()">Download all photos (zip)</button>':""}<div class="grid">${P.map(u=>`<img src="${u}" alt="" loading="lazy">`).join("")}</div></div>`}
function cmp(f,m,cb){const im=new Image();im.onload=()=>{const k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*k;c.height=im.height*k;c.getContext("2d").drawImage(im,0,0,c.width,c.height);cb(c.toDataURL("image/jpeg",.75))};im.src=URL.createObjectURL(f)}
function upl(fs){[...fs].forEach(f=>cmp(f,1600,async u=>{if(ON){try{P.unshift(await upBlob(Date.now()+"-"+Math.random().toString(36).slice(2,7)+".jpg",u));render();toast("Uploaded")}catch(e){toast("Upload failed")}}else{P.unshift(u);render()}}))}
function pimg(k,f){if(!f)return;cmp(f,1100,async u=>{if(ON){try{toast("Uploading…");S.ev[k]=await upBlob("_"+k+"-"+Date.now()+".jpg",u);await pushCfg()}catch(e){return toast("Upload failed")}}else{S.ev[k]=u;sv()}render()})}
function vReplies(){const k0=g=>S.rsvp[g]?S.rsvp[g].s:"p",N={att:t("att"),may:t("may"),no:t("no"),p:PEN[lang]},list=S.guests.filter(g=>k0(g)===AF),A=list.reduce((a,g)=>a+(S.rsvp[g]?S.rsvp[g].a:0),0),K=list.reduce((a,g)=>a+(S.rsvp[g]?S.rsvp[g].k:0),0);
return `<div class="card"><h3>${REP[lang]}</h3><div class="seg">${["att","may","no","p"].map(k=>`<button class="${AF===k?"on":""}" onclick="AF='${k}';render()">${N[k]} ${S.guests.filter(g=>k0(g)===k).length}</button>`).join("")}</div>${AF==="att"?`<p>${A} ${t("ad")} · ${K} ${t("ki")}</p>`:""}${list.map(g=>{const r=S.rsvp[g];return `<div class="row"><div class="av">${esc(g[0])}</div><div>${esc(g)}</div><div class="t">${r&&r.s==="att"?r.a+" + "+r.k:""}</div></div>`}).join("")||`<p>—</p>`}</div>`}
function fld(id,lb,v,ta){return `<label>${lb}</label>${ta?`<textarea id="${id}" rows="${ta}">${esc(v)}</textarea>`:`<input id="${id}" value="${esc(v)}">`}`}
function imgF(k,lb){const v=S.ev[k];return `<label>${lb}</label>${v?`<img src="${v}" alt="" style="width:100%;border-radius:12px;margin:6px 0">`:""}<label class="btn alt" style="display:block">${v?"Replace":"Upload"} image<input type="file" accept="image/*" hidden onchange="pimg('${k}',this.files[0])"></label>${v?`<button class="btn alt" onclick="rmImg('${k}')">Remove</button>`:""}`}
function vAdmin(){const p=pend(),v=S.ev;
return `<div class="pad"><h1 class="ti">${t("admin")}</h1>${vReplies()}
<div class="card"><h3>${t("serving")}</h3><div class="big" style="font-size:26px">${p[0]?esc(p[0].name):"—"}</div><button class="btn" onclick="adv('done')">${t("next")}</button><button class="btn alt" onclick="adv('no')">${t("noshow")}</button></div>

function book(name){if(S.slots.find(x=>x.name===name)){S.me=name;sv();return}const last=S.slots.reduce((m,x)=>Math.max(m,x.t),0),b=S.start?new Date(new Date().toDateString()+" "+S.start).getTime():0;S.slots.push({name,t:Math.max(last?last+S.mins*6e4:0,b,Date.now()+6e4),st:"p"});S.me=name;w5=w0=0;sv()}
